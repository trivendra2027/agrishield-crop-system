version: '3.8'

services:
  mongodb:
    image: mongo:6.0-jammy
    container_name: agrishield-mongodb
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet"]
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-crop_disease_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - agrishield-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrishield-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: ${ENV:-production}
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "False"
      MONGODB_URI: "mongodb://mongodb:27017"
      DATABASE_NAME: ${DATABASE_NAME:-crop_disease_db}
      UPLOAD_DIR: "uploads"
    volumes:
      - uploads_storage:/app/uploads
      - kb_storage:/app/knowledge_base
      - logs_storage:/app/backend/logs
    networks:
      - agrishield-net
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: agrishield-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - agrishield-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  agrishield-net:
    driver: bridge
    name: agrishield-network

volumes:
  mongodb_data:
    name: agrishield-mongodb-data
  uploads_storage:
    name: agrishield-uploads
  kb_storage:
    name: agrishield-kb
  logs_storage:
    name: agrishield-logs
