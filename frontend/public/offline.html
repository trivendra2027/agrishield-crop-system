<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — AgriShield AI</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.8);
      --border: rgba(51, 65, 85, 0.6);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem auto;
      border-radius: 1.25rem;
      background: rgba(16, 185, 129, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box svg {
      width: 2.25rem;
      height: 2.25rem;
      color: var(--primary);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
    }
    p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-box">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m-2.828-2.828a5 5 0 010-7.071m-4.243 4.243a1 1 0 01-1.414 0l-4.243-4.243a1 1 0 011.414-1.414L10 10.586l3.536-3.536a1 1 0 011.414 1.414L11.414 12z"></path>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>AgriShield AI is currently operating in offline mode. Please check your internet connection and try reconnecting.</p>
    <button class="btn" onclick="window.location.reload()">
      Try Reconnecting
    </button>
  </div>
  <script>
    // Automatically poll server every 2s and reload when online
    setInterval(() => {
      fetch('/api/v1/health', { method: 'HEAD' })
        .then(() => window.location.reload())
        .catch(() => {});
    }, 2000);
  </script>
</body>
</html>
